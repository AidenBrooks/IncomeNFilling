<div class="sh" style="border-radius:var(--radius-none)">none</div>
<div class="sh" style="border-radius:var(--radius-sm)">sm</div>
<div class="sh" style="border-radius:var(--radius-md)">md</div>
<div class="sh" style="border-radius:var(--radius-lg)">lg</div>
<div class="sh" style="border-radius:var(--radius-xl)">xl</div>
<div class="sh" style="border-radius:var(--radius-pill);width:110px">pill</div>
