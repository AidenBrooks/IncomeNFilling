<!-- @dsCard group="Colors" viewport="700x120" name="Semantic Status" subtitle="Dashboard status vocabulary used across ops panels" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--white)}.wrap{height:120px;display:flex;align-items:center;gap:12px;padding:0 24px;font-size:12px;letter-spacing:var(--tracking-wide);text-transform:uppercase}.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-pill);background:var(--paper-alt)}.dot{width:8px;height:8px;border-radius:50%}</style>
<div class="wrap">
<div class="pill"><span class="dot" style="background:var(--status-positive)"></span>positive</div>
<div class="pill"><span class="dot" style="background:var(--status-warning)"></span>warning</div>
<div class="pill"><span class="dot" style="background:var(--status-critical)"></span>critical</div>
<div class="pill"><span class="dot" style="background:var(--status-neutral)"></span>neutral</div>
<div class="pill"><span class="dot" style="background:var(--whatsapp-green)"></span>whatsapp</div>
</div>
