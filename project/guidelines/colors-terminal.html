<!-- @dsCard group="Colors" viewport="700x160" name="Terminal Register" subtitle="System-within-a-system — the CLI module breaks palette on purpose" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--term-bg)}.wrap{height:160px;display:flex;align-items:center;gap:28px;padding:0 24px;color:var(--term-fg)}.chip{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:11px}.dot{width:56px;height:56px;border-radius:var(--radius-sm);border:1px solid var(--term-border)}</style>
<div class="wrap">
<div class="chip"><div class="dot" style="background:var(--term-bg-raised)"></div>bg-raised</div>
<div class="chip"><div class="dot" style="background:var(--term-green)"></div>green</div>
<div class="chip"><div class="dot" style="background:var(--term-green-dim)"></div>green-dim</div>
<div class="chip"><div class="dot" style="background:var(--term-amber)"></div>amber</div>
<div class="chip"><div class="dot" style="background:var(--term-amber-dim)"></div>amber-dim</div>
<div class="chip"><div class="dot" style="background:var(--term-red)"></div>red</div>
<div style="font-size:14px">&gt; status: <span style="color:var(--term-green)">deployed</span>_</div>
</div>
