<!-- @dsCard group="Brand" viewport="700x200" name="Terminal Motifs" subtitle="Blinking cursor, live pulse, status ticker — the OS feels alive" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--term-bg);color:var(--term-fg);padding:20px 24px;height:160px;display:flex;flex-direction:column;gap:14px;justify-content:center}.row{display:flex;align-items:center;gap:10px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--term-green);animation:pulse-dot 2s infinite}</style>
<div class="row"><span class="dot"></span>Kolkata HQ — <span style="color:var(--term-green)">online</span></div>
<div class="row">&gt; <span>gst filing due in</span><b style="color:var(--term-amber)">3 days</b><span style="animation:blink-cursor 1s step-end infinite">_</span></div>
<div class="row" style="color:var(--term-fg-dim)">deadline ticker scrolls right→left · pulse dot marks live offices on the map</div>
