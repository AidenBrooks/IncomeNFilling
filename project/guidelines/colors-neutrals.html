<link rel="stylesheet" href="../styles.css">

<div class="row">
<div class="sw" style="background:var(--paper);color:var(--ink-900)">paper</div>
<div class="sw" style="background:var(--paper-alt);color:var(--ink-900)">paper-alt</div>
<div class="sw" style="background:var(--ink-100);color:var(--ink-900)">ink-100</div>
<div class="sw" style="background:var(--ink-300);color:var(--ink-900)">ink-300</div>
<div class="sw" style="background:var(--ink-500)">ink-500</div>
<div class="sw" style="background:var(--ink-700)">ink-700</div>
<div class="sw" style="background:var(--ink-900)">ink-900</div>
</div>
