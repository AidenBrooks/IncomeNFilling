<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body)}a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
<div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="ServicesHub.jsx"></script>
<script type="text/babel" src="ServiceDetail.jsx"></script>
<script type="text/babel" src="LiveChat.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
function App(){
const [screen,setScreen]=React.useState((location.hash||'#home').slice(1));
React.useEffect(()=>{
const onHash=()=>setScreen((location.hash||'#home').slice(1));
window.addEventListener('hashchange',onHash);
return ()=>window.removeEventListener('hashchange',onHash);
},[]);
const go=k=>{location.hash=k;};
const Screen={home:window.Home,services:window.ServicesHub,itr:window.ServiceDetail,chat:window.LiveChat,contact:window.Contact}[screen]||window.Home;
return <Screen go={go}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
